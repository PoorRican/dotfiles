# cbox Hyprland idle handling: lock the session, then turn the display off.
#
# Managed by Home Manager (nix/modules/hyprland-desktop.nix). Do not edit by hand.
#
# Why this exists: on Hyprland <= 0.55.3 a hand-bound `dispatch dpms off` key
# hit a monitor-disconnect crash path (CHeadlessOutput::commit SEGV). hypridle
# is the supported mechanism: it tracks input via idle-inhibit and drives both
# the lock and DPMS from a single idle timer, so the screen-off path is
# well-tested instead of a raw keybind.
#
# Timing: lock after 10 minutes idle, DPMS off after 15 minutes idle (i.e. the
# lock screen is visible for 5 minutes before the panel goes dark). Any input
# immediately wakes the display (the DPMS listener's on-resume) and the lock
# screen re-appears.
#
# Syntax: hypridle takes `general` and `listener` blocks with `key = value`
# entries. There is no top-level `on-timeout`/`exec-once` form; a file using
# that shape parses to "found 0 rules" and the daemon idles forever.
#
# DPMS is driven through the Lua dispatcher (`hl.dsp.dpms`). Hyprland 0.56
# parses `hyprctl dispatch <args>` as Lua, so the legacy `dispatch dpms off`
# string fails with "')' expected near 'off'".

general {
    # Also used for external lock requests (`loginctl lock-session`). The pidof
    # guard keeps a second hyprlock from stacking on top of a live one.
    lock_cmd = pidof hyprlock || /usr/bin/hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /usr/bin/hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 600
    on-timeout = pidof hyprlock || /usr/bin/hyprlock
}

listener {
    timeout = 900
    on-timeout = /usr/bin/hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = /usr/bin/hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
