# cbox Hyprland idle handling: lock the session, then turn the display off.
#
# Managed by Home Manager (nix/modules/hyprland-desktop.nix). Do not edit by hand.
#
# Why this exists: on Hyprland <= 0.55.3 a hand-bound `dispatch dpms off` key
# hit a monitor-disconnect crash path (CHeadlessOutput::commit SEGV). hypridle
# is the supported mechanism: it tracks input via idle-inhibit and drives both
# the lock and DPMS from a single idle timer, so the screen-off path is
# well-tested instead of a raw keybind.
#
# Timing: lock after 10 minutes idle, DPMS off after 15 minutes idle (i.e. the
# lock screen is visible for 5 minutes before the panel goes dark). Any input
# immediately wakes the display (hypridle on-resume) and the lock screen
# re-appears.

on-timeout 600
    exec-once: /usr/bin/hyprlock

on-timeout 900
    exec-once: /usr/bin/hyprctl dispatch dpms off

on-resume
    exec: /usr/bin/hyprctl dispatch dpms on
