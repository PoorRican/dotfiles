# cbox Hyprland lock screen.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 3
    inner_color = rgba(1a1a1add)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee)
    fail_color = rgba(ff6633ee)
    font_color = rgb(cdd6f4)
    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3
    fade_on_empty = false
    rounding = 14
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 72
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgb(a6adc8)
    font_size = 20
    font_family = $font
    position = 0, 55
    halign = center
    valign = center
}