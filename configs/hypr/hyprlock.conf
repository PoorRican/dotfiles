# cbox Hyprland lock screen: flat background, framed panel in the accent
# colour. Colours ($bg $bgAlt $edge $fg $muted $accent $accentDim $urgent)
# come from my.desktop.theme via nix/modules/desktop-theme.nix.
source = ~/.config/hypr/hyprlock-theme.conf
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    color = $bg
}

# Framed panel behind the prompt, like a focused terminal window.
shape {
    monitor =
    size = 520, 300
    color = $bgAlt
    rounding = 0
    border_size = 3
    border_color = $accent
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] printf '%s@%s ┄┄─ locked' "$(id -un)" "$(cat /etc/hostname)"
    color = $accentDim
    font_size = 13
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $accent
    font_size = 64
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %Y-%m-%d  W%V"
    color = $fg
    font_size = 14
    font_family = $font
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 44
    outline_thickness = 2
    inner_color = $bg
    outer_color = $accentDim
    check_color = $accent
    fail_color = $urgent
    font_color = $fg
    font_family = $font
    placeholder_text = <i>password:</i>
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_spacing = 0.3
    dots_rounding = 0
    fade_on_empty = false
    rounding = 0
    position = 0, -50
    halign = center
    valign = center
}
